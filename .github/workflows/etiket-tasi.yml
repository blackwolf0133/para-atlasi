# Tek seferlik: geçmiş yeniden yazıldıktan sonra eski etiketleri yeni kayıtlara taşır. İş bitince silinecek.
name: Etiket taşı (tek seferlik)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  tasi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          ok=0; bad=0
          while read t sha; do
            if git cat-file -e "$sha^{commit}" 2>/dev/null && git push -q -f origin "$sha:refs/tags/$t"; then ok=$((ok+1)); else echo "::warning::$t taşınamadı"; bad=$((bad+1)); fi
          done < .github/etiket_haritasi.txt
          echo "taşındı=$ok hata=$bad"
